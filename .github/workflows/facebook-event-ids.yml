name: Facebook-Veranstaltungs-IDs

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - eventbrite_changed

permissions:
  contents: read

concurrency:
  group: kulturhus-facebook-event-ids
  cancel-in-progress: false

jobs:
  scrape-upcoming-events:
    name: Kommende Facebook-Veranstaltungen lesen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Projekt laden
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright-core install --with-deps chromium

      - name: Kommende Veranstaltungs-IDs primaer lesen
        id: primary_scrape
        continue-on-error: true
        env:
          FACEBOOK_PAGE_SLUG: kulturhusjaderberg
          FACEBOOK_SCRAPER_DEBUG: "1"
        run: node server.mjs --scrape-once > facebook-events.json

      - name: Ergebnis auswaehlen und an ProcessWire melden
        env:
          PRIMARY_OUTCOME: ${{ steps.primary_scrape.outcome }}
          FACEBOOK_PAGE_SLUG: ${{ github.event.client_payload.page_slug || 'kulturhusjaderberg' }}
          PROCESSWIRE_CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          PROCESSWIRE_CALLBACK_TOKEN: ${{ secrets.EVENT_BROWSER_TOKEN }}
        run: node deliver.mjs

      - name: Ergebnis bereitstellen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: facebook-event-ids
          path: facebook-events.json
          if-no-files-found: error
          retention-days: 7
